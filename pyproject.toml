[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvsummary"
version = "0.1.0"
dependencies = [
    "requests==2.34.2"
]

[tool.setuptools.packages.find]
where = ["src"]

# Ruff formatting and linting settings
[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]